<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- PixiJS Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Pet Status Speech Bubble Overlay -->
  <div id="pet-dialog" class="pet-dialog hidden">
    <span id="dialog-text">안녕! 나랑 놀자 🐾</span>
  </div>

  <!-- Radial Context Menu Overlay -->
  <div id="radial-menu" class="radial-menu hidden">
    <button class="menu-btn" id="btn-feed" title="음식 주기">🍎</button>
    <button class="menu-btn" id="btn-play" title="놀아주기">🎾</button>
    <button class="menu-btn" id="btn-info" title="상태 보기">📊</button>
    <button class="menu-btn" id="btn-settings" title="설정 창">⚙️</button>
    <button class="menu-btn" id="btn-close" title="닫기">❌</button>
  </div>

  <!-- Status Modal HUD -->
  <div id="status-modal" class="status-modal hidden">
    <div class="modal-content">
      <h3>🐾 펫 상태 (Status)</h3>
      <div class="stat-row">
        <span>허기 (Fullness):</span>
        <div class="bar-bg"><div id="bar-fullness" class="bar-fill" style="width: 80%;"></div></div>
      </div>
      <div class="stat-row">
        <span>행복도 (Happiness):</span>
        <div class="bar-bg"><div id="bar-happiness" class="bar-fill happy" style="width: 90%;"></div></div>
      </div>
      <div class="stat-row">
        <span>경험치 (EXP):</span>
        <div class="bar-bg"><div id="bar-exp" class="bar-fill exp" style="width: 45%;"></div></div>
      </div>
      <button id="btn-modal-close" class="close-modal-btn">닫기</button>
    </div>
  </div>

  <!-- Settings Modal UI (NEW) -->
  <div id="settings-modal" class="status-modal hidden">
    <div class="modal-content">
      <h3>⚙️ 게임 & 캐릭터 설정</h3>
      <div class="setting-row">
        <label for="scale-range">캐릭터 크기: <span id="scale-value">100%</span></label>
        <input type="range" id="scale-range" min="50" max="250" step="5" value="100" />
      </div>
      <div class="setting-row setting-row--inline">
        <label for="hitbox-toggle">히트박스 표시</label>
        <label class="toggle-switch">
          <input type="checkbox" id="hitbox-toggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-hint">
        💡 슬라이더를 조절하여 다마고치 펫의 크기를 실시간으로 변경해보세요!
      </div>
      <button id="btn-settings-close" class="close-modal-btn">설정 완료</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
